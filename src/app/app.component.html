<main class="container" [class]="{ 'remote-on': serverRunning }">

  <div class="ip-address">{{ ipAddress }}:</div>

  <input
    class="port-input"
    [(ngModel)]="port"
    (ngModelChange)="stopServer()"
    id="port"
    min="1025"
    max="65500"
    type="number" />

  <div
    class="qr-code"
    (click)="toggleServer()"
    title="remote is {{ serverRunning ? 'ON' : 'OFF' }}"
  >
    <qr-code
      [style]="{ 'border-radius': '10px', 'border-bottom-right-radius': '0' }"
      value="{{ 'http://' + ipAddress + ':' + port() }}"
      size="260"
      margin="0"
      errorCorrectionLevel="M" />
  </div>

  <div class="autostart-container">
    <div class="hoverable">
      <div class="placeholder">• • •</div>
      <div class="autostart" (click)="toggleAutostart()" [style]="{ opacity: autostart ? 0.5 : 1 }">autostart {{ autostart ? 'OFF' : 'ON' }}</div>
    </div>
  </div>

</main>
